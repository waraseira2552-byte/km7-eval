<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KM7 · Evaluación Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,600;0,800;1,800&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --km-green: #B8E600;
    --km-green-dark: #9CC400;
    --km-green-soft: #E8FAB3;
    --km-black: #0A0A0A;
    --km-charcoal: #1A1A1A;
    --km-gray: #6B6B6B;
    --km-light-gray: #D5D5D5;
    --km-cream: #F5F5F0;
    --km-white: #FFFFFF;
    --km-red: #E63946;
    --km-amber: #F4A301;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.10);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.18);
    --radius-sm: 6px;
    --radius-md: 14px;
    --radius-lg: 24px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Manrope', sans-serif;
    background: var(--km-cream);
    color: var(--km-black);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    background: var(--km-black);
    border-bottom: 4px solid var(--km-green);
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .logo {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 26px; color: var(--km-white); letter-spacing: -0.5px;
  }
  .brand .logo span { color: var(--km-green); }
  .brand .tag {
    font-size: 10px; letter-spacing: 2px; color: var(--km-green);
    text-transform: uppercase; border-left: 1px solid var(--km-green); padding-left: 10px;
  }
  .top-actions { display: flex; gap: 12px; align-items: center; }
  .vendor-pill {
    background: var(--km-green); color: var(--km-black);
    padding: 6px 14px; border-radius: 20px;
    font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
  }
  .vendor-pill.admin { background: var(--km-amber); }
  .btn-icon {
    background: transparent; border: 1px solid var(--km-green);
    color: var(--km-green); padding: 6px 12px; border-radius: 6px;
    cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; transition: all 0.18s;
  }
  .btn-icon:hover { background: var(--km-green); color: var(--km-black); }
  .app { max-width: 1200px; margin: 0 auto; padding: 36px 24px 80px; }

  /* LOGIN */
  .login-shell {
    max-width: 460px; margin: 60px auto 0;
    background: var(--km-white); border-radius: var(--radius-lg);
    padding: 40px 36px; box-shadow: var(--shadow-md);
  }
  .login-shell .kicker {
    color: var(--km-gray); font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .login-shell h2 {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 32px; line-height: 1; margin-bottom: 6px;
  }
  .login-shell h2 .accent { color: var(--km-green-dark); }
  .login-shell .sub { color: var(--km-gray); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 11px; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--km-gray); font-weight: 600; margin-bottom: 6px;
  }
  .field select, .field input {
    width: 100%; padding: 14px 16px; border: 2px solid var(--km-light-gray);
    border-radius: var(--radius-sm); font-family: inherit; font-size: 15px;
    background: var(--km-white); transition: border 0.18s;
  }
  .field select:focus, .field input:focus {
    outline: none; border-color: var(--km-green);
  }
  .field input.pin-input {
    letter-spacing: 8px; text-align: center; font-family: 'Anton', sans-serif;
    font-size: 24px;
  }
  .error-msg {
    background: #FCEBED; color: var(--km-red);
    padding: 12px 14px; border-radius: var(--radius-sm); border-left: 4px solid var(--km-red);
    font-size: 13px; margin-bottom: 14px;
  }

  /* HERO */
  .hero-title { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 36px; }
  .hero-title .number {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 88px; color: var(--km-green); line-height: 0.85;
  }
  .hero-title .text { padding-top: 8px; }
  .hero-title .text .kicker {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--km-gray); margin-bottom: 4px;
  }
  .hero-title .text h1 {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 42px; line-height: 0.95;
  }
  .hero-title .text h1 .accent { color: var(--km-green-dark); }
  .hero-title .text p { color: var(--km-gray); margin-top: 10px; max-width: 600px; }

  .card { background: var(--km-white); border-radius: var(--radius-md); padding: 28px; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,0.04); }
  .card-dark { background: var(--km-black); color: var(--km-white); border-radius: var(--radius-md); padding: 28px; }

  /* TESTS */
  .tests-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .test-card {
    background: var(--km-white); border-radius: var(--radius-md); padding: 26px;
    cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.22s;
    position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,0.04);
  }
  .test-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .test-card .test-number {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 56px; color: var(--km-green); line-height: 1; margin-bottom: 14px;
  }
  .test-card h3 {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 22px; line-height: 1.1; margin-bottom: 8px;
  }
  .test-card .desc { color: var(--km-gray); font-size: 13px; margin-bottom: 16px; }
  .test-card .pages-tag {
    display: inline-block; background: var(--km-green-soft); color: var(--km-black);
    padding: 4px 10px; border-radius: 14px; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; font-weight: 600; margin-bottom: 16px;
  }
  .test-card .test-cta {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.06);
  }
  .test-card .test-cta .start { font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
  .test-card.completed .score-chip {
    background: var(--km-black); color: var(--km-green);
    padding: 4px 10px; border-radius: 14px;
    font-family: 'Anton', sans-serif; font-size: 14px; letter-spacing: 1px;
  }

  /* QUESTIONS */
  .test-shell {
    background: var(--km-white); border-radius: var(--radius-md);
    padding: 32px 36px; box-shadow: var(--shadow-md);
    max-width: 820px; margin: 0 auto;
  }
  .test-progress { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .test-progress .step {
    font-size: 12px; letter-spacing: 1.5px; color: var(--km-gray);
    text-transform: uppercase; font-weight: 600;
  }
  .test-progress .step strong { color: var(--km-black); font-size: 13px; }
  .progress-bar {
    height: 6px; background: var(--km-light-gray);
    border-radius: 999px; overflow: hidden; margin-bottom: 28px;
  }
  .progress-bar .fill { height: 100%; background: var(--km-green); transition: width 0.35s ease; }
  .question-text {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 26px; line-height: 1.2; margin-bottom: 28px;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    border: 2px solid var(--km-light-gray); background: var(--km-white);
    border-radius: var(--radius-md); padding: 16px 18px; text-align: left;
    cursor: pointer; font-family: inherit; font-size: 15px; color: var(--km-black);
    display: flex; gap: 14px; align-items: flex-start; transition: all 0.18s; line-height: 1.4;
  }
  .option:hover { border-color: var(--km-green); background: #FAFFEA; }
  .option .letter {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--km-black); color: var(--km-green);
    font-family: 'Anton', sans-serif; font-size: 14px; flex-shrink: 0;
  }
  .option.selected { border-color: var(--km-green); background: var(--km-green-soft); }
  .option.correct { border-color: var(--km-green); background: var(--km-green-soft); }
  .option.correct .letter { background: var(--km-green); color: var(--km-black); }
  .option.wrong { border-color: var(--km-red); background: #FCEBED; }
  .option.wrong .letter { background: var(--km-red); color: var(--km-white); }
  .option:disabled { cursor: default; }
  .feedback {
    margin-top: 22px; padding: 16px 18px; border-radius: var(--radius-md);
    border-left: 4px solid var(--km-green); background: var(--km-green-soft); font-size: 14px;
  }
  .feedback.wrong { border-left-color: var(--km-red); background: #FCEBED; }
  .feedback .label {
    font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    font-size: 12px; margin-bottom: 4px; display: block;
  }
  .feedback.wrong .label { color: var(--km-red); }
  .feedback:not(.wrong) .label { color: var(--km-green-dark); }

  .test-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; }
  .btn-primary {
    background: var(--km-black); color: var(--km-green); border: none;
    padding: 14px 28px; font-family: inherit; font-weight: 700;
    font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
    border-radius: var(--radius-sm); cursor: pointer; transition: all 0.18s;
  }
  .btn-primary:hover { background: var(--km-charcoal); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary.full { width: 100%; }
  .btn-secondary {
    background: transparent; color: var(--km-black);
    border: 2px solid var(--km-black); padding: 12px 22px;
    font-family: inherit; font-weight: 700; font-size: 12px;
    letter-spacing: 1.5px; text-transform: uppercase;
    border-radius: var(--radius-sm); cursor: pointer; transition: all 0.18s;
  }
  .btn-secondary:hover { background: var(--km-black); color: var(--km-green); }
  .btn-ghost {
    background: transparent; border: none; color: var(--km-gray);
    cursor: pointer; font-family: inherit; font-size: 13px;
    text-decoration: underline; text-underline-offset: 4px;
  }
  .btn-ghost:hover { color: var(--km-black); }

  /* RESULT */
  .result-hero {
    text-align: center; padding: 42px 30px;
    background: var(--km-black); color: var(--km-white);
    border-radius: var(--radius-lg); margin-bottom: 28px;
    position: relative; overflow: hidden;
  }
  .result-hero::before {
    content: ''; position: absolute; top: -50%; right: -10%;
    width: 60%; height: 200%; background: var(--km-green);
    opacity: 0.06; transform: rotate(15deg);
  }
  .result-hero .kicker {
    color: var(--km-green); font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .result-hero .score-big {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 120px; line-height: 1; color: var(--km-green);
  }
  .result-hero .score-big span { color: var(--km-white); font-size: 60px; }
  .result-hero .verdict {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 26px; margin-top: 8px;
  }
  .result-hero .verdict .accent { color: var(--km-green); }
  .area-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .area-card {
    background: var(--km-white); padding: 18px 20px;
    border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
    border-left: 4px solid var(--km-green);
  }
  .area-card.weak { border-left-color: var(--km-red); }
  .area-card.medium { border-left-color: var(--km-amber); }
  .area-card .area-name {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--km-gray); margin-bottom: 6px; font-weight: 600;
  }
  .area-card .area-value { font-family: 'Anton', sans-serif; font-size: 28px; }
  .area-card .area-detail { font-size: 12px; color: var(--km-gray); margin-top: 4px; }
  .area-card.weak .area-value { color: var(--km-red); }
  .area-card.medium .area-value { color: var(--km-amber); }
  .analysis-section { margin-top: 30px; }
  .analysis-section h3 {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 22px; margin-bottom: 14px;
  }
  .insight-card {
    background: var(--km-white); padding: 18px 20px;
    border-radius: var(--radius-md); margin-bottom: 12px;
    box-shadow: var(--shadow-sm); display: flex; gap: 16px; align-items: flex-start;
  }
  .insight-card .insight-icon {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 18px;
  }
  .insight-card.strength .insight-icon { background: var(--km-green); color: var(--km-black); }
  .insight-card.weak .insight-icon { background: var(--km-red); color: var(--km-white); }
  .insight-card.tip .insight-icon { background: var(--km-amber); color: var(--km-black); }
  .insight-card .insight-content .insight-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .insight-card .insight-content .insight-text { font-size: 13px; color: var(--km-gray); line-height: 1.5; }

  /* DASHBOARD */
  .dash-section { margin-bottom: 36px; }
  .dash-section .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .dash-section h2 {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800; font-size: 26px;
  }
  .dash-section h2 .slash { color: var(--km-green); }
  .leaderboard {
    background: var(--km-white); border-radius: var(--radius-md);
    overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .leaderboard table { width: 100%; border-collapse: collapse; }
  .leaderboard thead { background: var(--km-black); color: var(--km-green); }
  .leaderboard th {
    text-align: left; padding: 14px 18px; font-size: 11px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600;
  }
  .leaderboard td { padding: 16px 18px; border-bottom: 1px solid #F0F0EB; font-size: 14px; }
  .leaderboard tr:last-child td { border-bottom: none; }
  .leaderboard td.score { font-family: 'Anton', sans-serif; font-size: 20px; }
  .leaderboard .rank {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--km-light-gray); color: var(--km-black);
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Anton', sans-serif; font-size: 14px;
  }
  .leaderboard tr:nth-child(1) .rank { background: var(--km-green); }
  .leaderboard .pending { color: var(--km-gray); font-style: italic; font-size: 13px; }
  .mini-bar { width: 100%; height: 6px; background: var(--km-light-gray); border-radius: 999px; overflow: hidden; }
  .mini-bar .fill { height: 100%; background: var(--km-green); }
  .mini-bar.weak .fill { background: var(--km-red); }
  .mini-bar.medium .fill { background: var(--km-amber); }
  .areas-bars { display: flex; flex-direction: column; gap: 8px; }
  .area-bar-row {
    display: grid; grid-template-columns: 1fr 100px 50px;
    gap: 12px; align-items: center; font-size: 12px;
  }
  .area-bar-row .area-label {
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px;
  }
  .area-bar-row .area-val { font-family: 'Anton', sans-serif; font-size: 16px; text-align: right; }

  .vendor-detail-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 24px;
  }
  @media (max-width: 720px) { .vendor-detail-grid { grid-template-columns: 1fr; } }
  .detail-stat {
    background: var(--km-white); padding: 20px;
    border-radius: var(--radius-md); box-shadow: var(--shadow-sm);
  }
  .detail-stat .label {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--km-gray); font-weight: 600; margin-bottom: 6px;
  }
  .detail-stat .value { font-family: 'Anton', sans-serif; font-size: 36px; line-height: 1; }
  .detail-stat .value .small { font-size: 18px; color: var(--km-gray); }
  .detail-stat.green .value { color: var(--km-green-dark); }
  .test-result-card {
    background: var(--km-white); padding: 20px;
    border-radius: var(--radius-md); margin-bottom: 14px; box-shadow: var(--shadow-sm);
  }
  .test-result-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .test-result-card .header h4 {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800; font-size: 18px;
  }
  .test-result-card .header .score-tag {
    font-family: 'Anton', sans-serif; font-size: 22px;
    background: var(--km-black); color: var(--km-green);
    padding: 4px 14px; border-radius: 14px;
  }
  .test-result-card .header .score-tag.weak { background: var(--km-red); color: var(--km-white); }
  .test-result-card .header .score-tag.medium { background: var(--km-amber); color: var(--km-black); }

  .empty-state { text-align: center; padding: 60px 30px; color: var(--km-gray); }
  .empty-state h3 {
    font-family: 'Archivo', sans-serif; font-style: italic; font-weight: 800;
    font-size: 22px; color: var(--km-black); margin-bottom: 8px;
  }
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 80px 20px; color: var(--km-gray); font-size: 14px;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .loading::after {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--km-green); margin-left: 10px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .view { animation: fadeUp 0.35s ease; }
  .hidden { display: none !important; }
  .foot {
    text-align: center; padding: 20px 0; color: var(--km-gray);
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    margin-top: 40px; border-top: 1px solid #E5E5E0;
  }
  .foot strong { color: var(--km-green-dark); }

  @media (max-width: 640px) {
    .topbar { padding: 14px 16px; }
    .brand .logo { font-size: 20px; }
    .brand .tag { display: none; }
    .app { padding: 24px 14px 60px; }
    .hero-title .number { font-size: 60px; }
    .hero-title .text h1 { font-size: 28px; }
    .test-shell { padding: 22px 18px; }
    .question-text { font-size: 20px; }
    .result-hero .score-big { font-size: 80px; }
    .result-hero .score-big span { font-size: 36px; }
    .leaderboard td, .leaderboard th { padding: 12px 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">KM<span>7</span></span>
    <span class="tag">Eval. Comercial · 2026</span>
  </div>
  <div class="top-actions" id="topActions"></div>
</header>

<main class="app" id="app"></main>

<footer class="foot">
  <strong>Kilómetro 7 Panamá</strong> · Manual de Ventas · Uso Interno
</footer>

<script>
// ============================================================
// CONFIG · TESTS DATA (igual que la versión local)
// ============================================================
const TESTS = [
  {
    id: 'test1', number: '01', title: 'ADN de Ventas + Lenguaje',
    desc: 'Bienvenida, conexión, despedida y palabras que generan deseo.',
    pages: 'Págs. 18 – 19',
    questions: [
      { q: '¿Cuál es la frase oficial de bienvenida del ADN de Ventas KM7?', options: ['"¡Hola! Bienvenido a Kilómetro 7. Mi nombre es ___. ¿Qué estás buscando hoy: rines, llantas o audio?"','"Bienvenido a la tienda, ¿en qué le ayudo hoy?"','"Buenas, ¿qué anda buscando?"','"Hola, ¿qué desea cotizar?"'], area: 'Bienvenida' },

const SESSION_KEY = 'km7_session';
let state = {
  session: loadSession(),
  view: 'login',
  vendors: [],
  results: [],
  isAdmin: false,
  currentTest: null,
  currentQuestionIndex: 0,
  currentSelections: [],
  selectedOption: null,
  showFeedback: false,
  detailVendorId: null,
  error: null
};

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.token || !s.vendor) return null;
    return s;
  } catch { return null; }
}

function saveSession(session) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch {}
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY);
  state.session = null;
}

// ============================================================
// API CALLS
// ============================================================
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.session?.token) headers['Authorization'] = `Bearer ${state.session.token}`;
  const res = await fetch(path, { ...options, headers });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Error en el servidor');
  return data;
}

async function doLogin(vendor_id, pin) {
  const data = await api('/api/login', {
    method: 'POST',
    body: JSON.stringify({ vendor_id, pin })
  });
  state.session = { token: data.token, vendor: data.vendor, is_admin: data.is_admin };
  saveSession(state.session);
  return data;
}

async function loadVendors() {
  const data = await api('/api/vendors');
  state.vendors = data.vendors;
}

async function loadResults() {
  const data = await api('/api/results');
  state.results = data.results;
  state.vendors = data.vendors;
  state.isAdmin = data.is_admin;
}

async function submitResult(test_id, score, total, area_stats) {
  await api('/api/submit-result', {
    method: 'POST',
    body: JSON.stringify({ test_id, score, total, area_stats })
  });
}

// ============================================================
// UTILS
// ============================================================
function shuffleOptions(originalOptions) {
  const correct = originalOptions[0];
  const arr = [...originalOptions];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return { shuffled: arr, correctIndex: arr.indexOf(correct) };
}

function verdictText(pct) {
  if (pct === 100) return ['Dominio total', 'manejas el manual KM7 al 100%.'];
  if (pct >= 80) return ['Excelente desempeño', 'estás listo para cerrar en sala.'];
  if (pct >= 60) return ['En camino', 'necesitas reforzar conceptos clave.'];
  if (pct >= 40) return ['Necesita repaso', 'vuelve a estudiar el manual.'];
  return ['Atención prioritaria', 'requiere capacitación inmediata.'];
}

function getVendorTests(vendorId) {
  return state.results.filter(r => r.vendor_id === vendorId);
}

function getVendorOverall(vendorId) {
  const tests = getVendorTests(vendorId);
  if (!tests.length) return { tests: 0, avg: 0 };
  const totalScore = tests.reduce((s, t) => s + t.score, 0);
  const totalTotal = tests.reduce((s, t) => s + t.total, 0);
  return {
    tests: tests.length,
    avg: Math.round((totalScore / totalTotal) * 100)
  };
}

// ============================================================
// RENDER
// ============================================================
async function render() {
  renderTopActions();
  const app = document.getElementById('app');
  app.innerHTML = '';
  void app.offsetWidth;
  app.classList.add('view');

  if (!state.session) {
    state.view = 'login';
    return renderLogin();
  }

  if (state.view === 'login') {
    state.view = state.session.is_admin ? 'dashboard' : 'tests';
  }

  if (state.view === 'tests') return renderTests();
  if (state.view === 'test-in-progress') return renderQuestion();
  if (state.view === 'result') return renderResult();
  if (state.view === 'dashboard') return renderDashboard();
  if (state.view === 'vendor-detail') return renderVendorDetail();
}

function renderTopActions() {
  const el = document.getElementById('topActions');
  el.innerHTML = '';
  if (!state.session) return;

  const pill = document.createElement('span');
  pill.className = 'vendor-pill' + (state.session.is_admin ? ' admin' : '');
  pill.textContent = state.session.vendor.name;
  el.appendChild(pill);

  if (state.session.is_admin) {
    const dashBtn = document.createElement('button');
    dashBtn.className = 'btn-icon';
    dashBtn.textContent = 'Dashboard';
    dashBtn.onclick = () => { state.view = 'dashboard'; render(); };
    el.appendChild(dashBtn);
  } else {
    const testsBtn = document.createElement('button');
    testsBtn.className = 'btn-icon';
    testsBtn.textContent = 'Mis Pruebas';
    testsBtn.onclick = () => { state.view = 'tests'; render(); };
    el.appendChild(testsBtn);

    const myStatsBtn = document.createElement('button');
    myStatsBtn.className = 'btn-icon';
    myStatsBtn.textContent = 'Mi Desempeño';
    myStatsBtn.onclick = () => {
      state.detailVendorId = state.session.vendor.id;
      state.view = 'vendor-detail';
      render();
    };
    el.appendChild(myStatsBtn);
  }

  const logoutBtn = document.createElement('button');
  logoutBtn.className = 'btn-icon';
  logoutBtn.textContent = 'Salir';
  logoutBtn.onclick = () => {
    clearSession();
    state.view = 'login';
    render();
  };
  el.appendChild(logoutBtn);
}

      <button class="btn-primary full" onclick="handleLogin()">Ingresar →</button>
    </div>
  `;

  document.getElementById('pinInput').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
}

async function handleLogin() {
  const vendor_id = document.getElementById('vendorSelect').value;
  const pin = document.getElementById('pinInput').value;
  if (!vendor_id || !pin) {
    state.error = 'Selecciona vendedor e ingresa PIN.';
    return render();
  }
  state.error = null;
  try {
    await doLogin(vendor_id, pin);
    await loadResults();
    state.view = state.session.is_admin ? 'dashboard' : 'tests';
    render();
  } catch (e) {
    state.error = e.message;
    render();
  }
}

async function renderTests() {

// ============================================================
// VIEW: TEST IN PROGRESS
// ============================================================
function startTest(testId) {
  const test = TESTS.find(t => t.id === testId);
  const runQuestions = test.questions.map(q => {
    const { shuffled, correctIndex } = shuffleOptions(q.options);
    return { ...q, displayOptions: shuffled, correctIndex };
  });
  state.currentTest = { ...test, runQuestions };
  state.currentQuestionIndex = 0;
  state.currentSelections = [];
  state.selectedOption = null;
  state.showFeedback = false;
  state.view = 'test-in-progress';
  render();
}

function renderQuestion() {
  const app = document.getElementById('app');
  const test = state.currentTest;
  const idx = state.currentQuestionIndex;
  const q = test.runQuestions[idx];
  const progress = ((idx + (state.showFeedback ? 1 : 0)) / test.questions.length) * 100;
  const isLast = idx === test.questions.length - 1;

  app.innerHTML = `
    <div class="test-shell">
      <div class="test-progress">
        <span class="step">Prueba <strong>${test.number}</strong> · ${test.title}</span>
        <span class="step">Pregunta <strong>${idx + 1}</strong> / ${test.questions.length}</span>
      </div>
      <div class="progress-bar"><div class="fill" style="width:${progress}%"></div></div>
      <div class="question-text">${q.q}</div>
      <div class="options" id="optionsList"></div>
      <div id="feedbackArea"></div>
      <div class="test-controls">
        <button class="btn-ghost" onclick="quitTest()">← Salir sin guardar</button>
        <button class="btn-primary" id="nextBtn" ${state.selectedOption === null ? 'disabled' : ''}
          onclick="${state.showFeedback ? (isLast ? 'finalizeTest()' : 'goNextQuestion()') : 'submitAnswer()'}">
          ${state.showFeedback ? (isLast ? 'Finalizar prueba' : 'Siguiente pregunta →') : 'Confirmar respuesta'}
        </button>
      </div>
    </div>
  `;

  const optionsList = document.getElementById('optionsList');
  const letters = ['A', 'B', 'C', 'D'];
  q.displayOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    if (state.selectedOption === i && !state.showFeedback) btn.classList.add('selected');
    if (state.showFeedback) {
      btn.disabled = true;
      if (i === q.correctIndex) btn.classList.add('correct');
      else if (i === state.selectedOption) btn.classList.add('wrong');
    }
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => {
      if (state.showFeedback) return;
      state.selectedOption = i;
      render();
    };
    optionsList.appendChild(btn);
  });

  if (state.showFeedback) {
    const fb = document.getElementById('feedbackArea');
    const correct = state.selectedOption === q.correctIndex;
    fb.innerHTML = `
      <div class="feedback ${correct ? '' : 'wrong'}">
        <span class="label">${correct ? '✓ Respuesta correcta' : '✕ Respuesta incorrecta'}</span>
        ${correct ? 'Excelente. Esta respuesta está alineada con el Manual KM7.'
                  : `La respuesta correcta era: <strong>${q.displayOptions[q.correctIndex]}</strong>`}
      </div>
    `;
  }
}

function submitAnswer() {
  if (state.selectedOption === null) return;
  const q = state.currentTest.runQuestions[state.currentQuestionIndex];
  const isCorrect = state.selectedOption === q.correctIndex;
  state.currentSelections.push({
    qIndex: state.currentQuestionIndex,
    selected: state.selectedOption,
    isCorrect,
    area: q.area
  });
  state.showFeedback = true;
  render();
}

function goNextQuestion() {
  state.currentQuestionIndex++;
  state.selectedOption = null;
  state.showFeedback = false;
  render();
}

async function finalizeTest() {
  const areaStats = {};
  state.currentSelections.forEach(sel => {
    if (!areaStats[sel.area]) areaStats[sel.area] = { correct: 0, total: 0 };
    areaStats[sel.area].total++;
    if (sel.isCorrect) areaStats[sel.area].correct++;
  });
  const score = state.currentSelections.filter(s => s.isCorrect).length;
  const total = state.currentSelections.length;

  try {
    await submitResult(state.currentTest.id, score, total, areaStats);
    await loadResults();
    state.view = 'result';
    state._lastResult = { test: state.currentTest, score, total, areaStats };
    render();
  } catch (e) {
    alert('Error guardando: ' + e.message);
  }
}

function quitTest() {
  if (confirm('¿Salir de la prueba? No se guardarán los resultados.')) {
    state.currentTest = null;
    state.view = 'tests';
    state.selectedOption = null;
    state.showFeedback = false;
    state.currentSelections = [];
    render();
  }
}

// ============================================================
// VIEW: RESULT
// ============================================================
function renderResult() {
  const app = document.getElementById('app');
  const r = state._lastResult;
  if (!r) { state.view = 'tests'; return render(); }
  const pct = Math.round((r.score / r.total) * 100);
  const [verdictMain, verdictSub] = verdictText(pct);

  const areas = Object.entries(r.areaStats).map(([name, stats]) => ({
    name, correct: stats.correct, total: stats.total,
    pct: Math.round((stats.correct / stats.total) * 100)
  })).sort((a,b) => a.pct - b.pct);

  const weakAreas = areas.filter(a => a.pct < 60);
  const mediumAreas = areas.filter(a => a.pct >= 60 && a.pct < 80);
  const strongAreas = areas.filter(a => a.pct >= 80);

  app.innerHTML = `
    <div class="result-hero">
      <div class="kicker">${state.session.vendor.name} · ${r.test.title}</div>
      <div class="score-big">${pct}<span>%</span></div>
      <div class="verdict">${verdictMain.toUpperCase()} <span class="accent">·</span> ${verdictSub}</div>
      <div style="margin-top:14px;font-size:13px;color:#aaa;">${r.score} de ${r.total} preguntas correctas</div>
    </div>
    <div class="area-grid" id="areaGrid"></div>
    <div class="analysis-section">
      <h3>Análisis · Áreas a Mejorar</h3>
      <div id="insights"></div>
    </div>
    <div style="margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;">
      <button class="btn-primary" onclick="state.view='tests';render();">← Volver a pruebas</button>
    </div>
  `;

  const areaGrid = document.getElementById('areaGrid');
  areas.slice(0, 6).forEach(a => {
    const cls = a.pct >= 80 ? '' : (a.pct >= 60 ? 'medium' : 'weak');
    const ac = document.createElement('div');
    ac.className = 'area-card ' + cls;
    ac.innerHTML = `
      <div class="area-name">${a.name}</div>
      <div class="area-value">${a.pct}%</div>
      <div class="area-detail">${a.correct} de ${a.total} respuestas correctas</div>
    `;
    areaGrid.appendChild(ac);
  });

  const insights = document.getElementById('insights');
  if (strongAreas.length) {
    const card = document.createElement('div');
    card.className = 'insight-card strength';
    card.innerHTML = `
      <div class="insight-icon">✓</div>
      <div class="insight-content">
        <div class="insight-title">Fortalezas detectadas</div>
        <div class="insight-text">Dominas: <strong>${strongAreas.map(a => a.name).join(', ')}</strong>. Estos conceptos están bien interiorizados.</div>
      </div>`;
    insights.appendChild(card);
  }
  mediumAreas.forEach(a => {
    const card = document.createElement('div');
    card.className = 'insight-card tip';
    card.innerHTML = `
      <div class="insight-icon">!</div>
      <div class="insight-content">
        <div class="insight-title">Reforzar · ${a.name} (${a.pct}%)</div>
        <div class="insight-text">${AREA_ADVICE[a.name] || 'Repasa esta sección del manual.'}</div>
      </div>`;
    insights.appendChild(card);
  });
  weakAreas.forEach(a => {
    const card = document.createElement('div');
    card.className = 'insight-card weak';
    card.innerHTML = `
      <div class="insight-icon">×</div>
      <div class="insight-content">
        <div class="insight-title">Acción urgente · ${a.name} (${a.pct}%)</div>
        <div class="insight-text">${AREA_ADVICE[a.name] || 'Revisa esta sección con prioridad.'}</div>
      </div>`;
    insights.appendChild(card);
  });
}

// ============================================================
// VIEW: DASHBOARD (ADMIN)
// ============================================================
async function renderDashboard() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Cargando dashboard</div>';
  await loadResults();

  const board = state.vendors.map(v => {
    const overall = getVendorOverall(v.id);
    return { vendor: v, ...overall };
  }).sort((a,b) => b.tests !== a.tests ? b.tests - a.tests : b.avg - a.avg);

  // Áreas globales
  const areaAgg = {};
  state.results.forEach(r => {
    Object.entries(r.area_stats || {}).forEach(([area, st]) => {
      if (!areaAgg[area]) areaAgg[area] = { correct: 0, total: 0 };
      areaAgg[area].correct += st.correct;
      areaAgg[area].total += st.total;
    });
  });
  const areas = Object.entries(areaAgg).map(([name, st]) => ({
    name, pct: Math.round((st.correct / st.total) * 100),
    correct: st.correct, total: st.total
  })).sort((a,b) => a.pct - b.pct);

  app.innerHTML = `
    <div class="hero-title">
      <span class="number">/</span>
      <div class="text">
        <div class="kicker">Vista General · Equipo Comercial</div>
        <h1>DASHBOARD <span class="accent">GLOBAL</span></h1>
        <p>Resumen del desempeño del equipo. Datos centralizados en tiempo real.</p>
      </div>
    </div>

    <div class="dash-section">
      <div class="section-head"><h2>RANKING <span class="slash">/</span></h2></div>
      <div class="leaderboard">
        <table>
          <thead>
            <tr><th>#</th><th>Vendedor</th><th>Pruebas</th><th>Promedio</th><th></th></tr>
          </thead>
          <tbody id="boardBody"></tbody>
        </table>
      </div>
    </div>

    <div class="dash-section">
      <div class="section-head"><h2>ÁREAS DEL EQUIPO <span class="slash">/</span></h2></div>
      <div id="globalAreas"></div>
    </div>
  `;

  const body = document.getElementById('boardBody');
  board.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="rank">${i + 1}</span></td>
      <td><strong>${row.vendor.name}</strong></td>
      <td>${row.tests}/3</td>
      <td class="score">${row.tests ? row.avg + '%' : '<span class="pending">Pendiente</span>'}</td>
      <td style="text-align:right;"><button class="btn-icon" data-vendor="${row.vendor.id}">Ver detalle →</button></td>
    `;
    tr.querySelector('button[data-vendor]').onclick = () => {
      state.detailVendorId = row.vendor.id;
      state.view = 'vendor-detail';
      render();
    };
    body.appendChild(tr);
  });

  const ga = document.getElementById('globalAreas');
  if (!areas.length) {
    ga.innerHTML = `<div class="card empty-state"><h3>Sin datos aún</h3><p>Cuando completen pruebas, verás el análisis por área.</p></div>`;
  } else {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="areas-bars" id="areasBars"></div>`;
    ga.appendChild(card);
    const bars = card.querySelector('#areasBars');
    areas.forEach(a => {
      const cls = a.pct >= 80 ? '' : a.pct >= 60 ? 'medium' : 'weak';
      const row = document.createElement('div');
      row.className = 'area-bar-row';
      row.innerHTML = `
        <div class="area-label">${a.name}</div>
        <div class="mini-bar ${cls}"><div class="fill" style="width:${a.pct}%"></div></div>
        <div class="area-val">${a.pct}%</div>
      `;
      bars.appendChild(row);
    });
  }
}

  const vendor = state.vendors.find(v => v.id === state.detailVendorId) || state.session.vendor;

    Object.entries(t.area_stats || {}).forEach(([area, st]) => {
      if (!areaAgg[area]) areaAgg[area] = { correct: 0, total: 0 };
      areaAgg[area].correct += st.correct;
      areaAgg[area].total += st.total;
    });
  });
  const areas = Object.entries(areaAgg).map(([name, st]) => ({
    name, pct: Math.round((st.correct / st.total) * 100),

  })).sort((a,b) => a.pct - b.pct);

        <div class="label">Pruebas completadas</div>
        <div class="value">${overall.tests}<span class="small"> / 3</span></div>
      </div>

}
